<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Studio Code</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d0e10;
    --coral: #c9a227;
    --coral-dark: #a8871f;
    --mint: #4a9b7f;
    --cream: #17181b;
    --grey: #9a9ea3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 480px; }
  .code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 500; letter-spacing: 2px; color: var(--coral); margin-bottom: 14px; text-transform: uppercase; }
  h1 { font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; font-size: 30px; margin-bottom: 16px; }
  h1 span { color: var(--coral); }
  p { color: #c3ccd4; font-size: 15.5px; margin-bottom: 30px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14.5px;
  }
  a.btn-primary { background: var(--coral); color: var(--navy); }
  a.btn-primary:hover { background: var(--coral-dark); }
  a.btn-outline { border: 1.5px solid rgba(255,255,255,0.35); color: #fff; }
  a.btn-outline:hover { background: var(--coral); border-color: var(--coral); color: var(--navy); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe <span>pas (encore)</span></h1>
    <p>Le lien que vous avez suivi est peut-être cassé, ou la page a été déplacée. Retournez à l'accueil ou découvrez nos styles de sites.</p>
    <div class="links">
      <a class="btn btn-primary" href="index.html">Retour à l'accueil</a>
      <a class="btn btn-outline" href="styles.html">Portfolio</a>
    </div>
    <p style="margin-top:24px; font-size:12.5px;"><a href="mentions-legales.html" style="color:var(--mint); font-weight:600;">Mentions légales</a></p>
  </div>
</body>
</html>
