<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Elodie.dev</title>
<style>
  :root {
    --navy: #1c2b3a;
    --coral: #e8623d;
    --coral-dark: #c94f2e;
    --mint: #4fb0a5;
    --cream: #f7f5f1;
    --grey: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 480px; }
  .code { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--mint); margin-bottom: 14px; text-transform: uppercase; }
  h1 { font-size: 30px; margin-bottom: 16px; }
  h1 span { color: var(--coral); }
  p { color: #c3ccd4; font-size: 15.5px; margin-bottom: 30px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14.5px;
  }
  a.btn-primary { background: var(--coral); color: #fff; }
  a.btn-primary:hover { background: var(--coral-dark); }
  a.btn-outline { border: 1.5px solid rgba(255,255,255,0.35); color: #fff; }
  a.btn-outline:hover { background: #fff; color: var(--navy); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe <span>pas (encore)</span></h1>
    <p>Le lien que vous avez suivi est peut-être cassé, ou la page a été déplacée. Retournez à l'accueil ou découvrez nos styles de sites.</p>
    <div class="links">
      <a class="btn btn-primary" href="index.html">Retour à l'accueil</a>
      <a class="btn btn-outline" href="styles.html">Nos styles</a>
    </div>
  </div>
</body>
</html>
