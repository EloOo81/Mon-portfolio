<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Elodie.dev</title>
<style>
  :root {
    --navy: #1c2b3a;
    --coral: #e8623d;
    --mint: #4fb0a5;
    --cream: #f7f5f1;
    --grey: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 480px; }
  h1 { font-size: 30px; margin-bottom: 16px; }
  h1 span { color: var(--coral); }
  p { color: #c3ccd4; font-size: 15.5px; margin-bottom: 30px; }
  a.btn {
    display: inline-block;
    background: var(--coral);
    color: #fff;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14.5px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Merci <span>!</span></h1>
    <p>Votre demande a bien été envoyée. Je reviens vers vous par email sous 48h avec un devis précis.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
