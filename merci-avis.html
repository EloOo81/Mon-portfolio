<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre avis — Elodie.dev</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0d0e10; --coral: #c9a227; --mint: #4a9b7f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--navy);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 480px; }
  h1 { font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; font-size: 30px; margin-bottom: 16px; }
  h1 span { color: var(--coral); }
  p { color: #c3ccd4; font-size: 15.5px; margin-bottom: 30px; }
  a.btn {
    display: inline-block;
    background: var(--coral);
    color: var(--navy);
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14.5px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Merci <span>!</span></h1>
    <p>Votre avis a bien été envoyé. Il pourra être publié sur le site prochainement — merci d'avoir pris le temps de le partager.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
